plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

boolean ldlib2      = false
boolean raritycore  = false
boolean confluence  = false
boolean treasurebags = false
boolean lootbundles = false
boolean neoforgeDatagen = false

boolean lootr = true
boolean ftb   = true

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            exclude '**/*.bbmodel'
            exclude '**/*.zip'
            exclude '**/.cache'
        }
    }
}

if (ldlib2 || raritycore || confluence || treasurebags || lootbundles || neoforgeDatagen) {
    sourceSets.main.java.srcDir 'src/neoforge-only/java'
    logger.lifecycle("GachaAddiction: compilando 'src/neoforge-only/java' (requiere dependencias NeoForge)")
}

repositories {
    mavenCentral()

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
        content { includeGroup 'org.parchmentmc.data' }
    }

    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content { includeGroup 'fuzs.forgeconfigapiport' }
    }

    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel.cloth' }
    }

    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'noobanidus.mods.lootr' }
    }

    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }

    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }

    maven {
        name = 'Bawnorton'
        url = 'https://maven.bawnorton.com/releases'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    maven {
        name = 'Progwml6'
        url = 'https://dvs1.progwml6.com/files/maven/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${clothconfig_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    compileOnly annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}")
    include implementation("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}")

    if (lootr) {
        modCompileOnly "noobanidus.mods.lootr:lootr-common:${lootr_version}"
        modCompileOnly "noobanidus.mods.lootr:lootr-fabric:${lootr_version}"
        modLocalRuntime "noobanidus.mods.lootr:lootr-fabric:${lootr_version}"
    }

    if (ftb) {
        modCompileOnly "dev.architectury:architectury-fabric:${architectury_version}"
        modCompileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library_version}") { transitive = false }
        modCompileOnly("dev.ftb.mods:ftb-quests-fabric:${ftb_quests_version}") { transitive = false }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/gachaaddiction.accesswidener')

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client { client() }
        server { server(); programArg '--nogui' }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_description', mod_description

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_description: mod_description,
                minecraft_version: minecraft_version,
                fabric_loader_version: fabric_loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}
